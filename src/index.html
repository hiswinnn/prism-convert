<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#04050b" />
<meta name="description" content="棱镜 Prism — 纯前端双端全能文件转换器：AI 聊天记录、文档、表格、图片、PDF、音视频、压缩包、字幕，全部在本机完成，不上传服务器。" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>棱镜 Prism · 全能文件转换</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./styles/tokens.css" />
<link rel="stylesheet" href="./styles/glass.css" />
<link rel="stylesheet" href="./styles/app.css" />
<!--
  裸模块名映射：让 src/core/* 里的 `api.lib('fflate')` 与第三方 ESM 内部的裸导入
  在浏览器里也能解析。值用**相对的 ./vendor/lib/**（相对本文档），这样站点部署在
  子路径（如 https://user.github.io/repo/）时不会指向域名根目录而 404。
-->
<script type="importmap">
{
  "imports": {
    "fflate": "./vendor/lib/fflate/esm/browser.js",
    "xlsx": "./vendor/lib/xlsx/xlsx.mjs",
    "pdf-lib": "./vendor/lib/pdf-lib/dist/pdf-lib.esm.js",
    "pdfjs-dist": "./vendor/lib/pdfjs-dist/build/pdf.mjs",
    "pdfjs-dist/": "./vendor/lib/pdfjs-dist/",
    "mammoth": "./vendor/lib/mammoth/mammoth.browser.min.js",
    "docx": "./vendor/lib/docx/dist/index.mjs",
    "marked": "./vendor/lib/marked/lib/marked.esm.js",
    "turndown": "./vendor/lib/turndown/lib/turndown.browser.es.js",
    "js-yaml": "./vendor/lib/js-yaml/dist/js-yaml.mjs",
    "@ffmpeg/ffmpeg": "./vendor/lib/@ffmpeg/ffmpeg/dist/esm/index.js",
    "@ffmpeg/core": "./vendor/lib/@ffmpeg/core/dist/esm/ffmpeg-core.js",
    "libheif-js": "./vendor/lib/libheif-js/libheif-wasm/libheif-bundle.mjs"
  }
}
</script>
</head>
<body>

<!-- 图标精灵：全部用 stroke 线性图标，任何尺寸都不会糊 -->

  <symbol id="i-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6.5l10-2v11"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></symbol>

  <symbol id="i-wand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19 15.5 8.5"/><path d="M17.5 3.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/><path d="M7.5 4.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4L5.5 6.5l1.4-.6z"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5"/><path d="M5 19h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7h15M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7"/><path d="M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7"/><path d="M10.5 11v6M13.5 11v6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 21 19.5H3z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 8h.01"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></symbol>

  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 19 6v5.5c0 4.3-2.9 7.6-7 9-4.1-1.4-7-4.7-7-9V6z"/><path d="M9 12l2 2 4-4.5"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3 5.5 13.5H11L10 21l7.5-10.5H12z"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13m0 0-5-5m5 5-5 5"/></symbol>

  <symbol id="i-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M8 5.5 18.5 12 8 18.5z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M8 6.5h12M8 12h12M8 17.5h12M4 6.5h.01M4 12h.01M4 17.5h.01"/></symbol>
</svg>

<div class="app">
  <header class="topbar glass rise" id="topbar">
    <div class="brand">
      <span class="brand__mark"><svg><use href="#i-prism"/></svg></span>
      <span class="brand__text">
        <span class="brand__name">棱镜 Prism</span>
        <span class="brand__sub">本机转换 · 不上传 · 手机电脑同一套</span>
      </span>
    </div>
    <nav class="nav" id="nav" aria-label="主导航"></nav>
    <span class="status-dot" id="engine-status" title="引擎状态">引擎待命</span>
    <button class="iconbtn" id="perf-toggle" title="性能模式（关闭部分毛玻璃）" aria-label="切换性能模式"><svg><use href="#i-bolt"/></svg></button>
    <button class="iconbtn" id="theme-toggle" title="切换明暗" aria-label="切换明暗主题"><svg><use href="#i-moon"/></svg></button>
  </header>

  <main id="view"></main>
</div>

<nav class="tabbar glass" id="tabbar" aria-label="底部导航"></nav>
<div class="toast-stack" id="toasts" aria-live="polite"></div>
<div id="sheet-root"></div>
<div class="mobile-actionbar" id="mobile-actionbar" hidden></div>

<script type="module" src="./main.js"></script>
</body>
</html>
